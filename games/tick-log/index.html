<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4ECDC4">
  <meta name="format-detection" content="telephone=no">
  <!-- iOS 添加到主屏幕 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="快记小事">
  <title>快记小事</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="app.css">
  <script>
    // file:// 直接双击：ES 模块被浏览器禁止 -> 改用打包好的 bundle.js（普通脚本）
    if (location.protocol === 'file:') {
      document.write('<script src="./bundle.js"><\/script>');
    }
  </script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <span class="app-title">快记小事</span>
    </header>
    <main id="view" class="view"></main>
    <nav class="tabbar">
      <a class="tab" href="#/home" data-tab="#/home">记录</a>
      <a class="tab" href="#/stats" data-tab="#/stats">统计</a>
      <a class="tab" href="#/history" data-tab="#/history">历史</a>
      <a class="tab" href="#/settings" data-tab="#/settings">设置</a>
    </nav>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
